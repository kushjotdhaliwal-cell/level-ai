<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d1b"><title>LEVEL AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header><div class="mark">L</div><div><h1>LEVEL AI</h1><p>Your AI. Your level.</p></div><span class="free">FREE</span></header>
  <main id="chat" aria-live="polite">
    <div class="welcome"><div class="orb">✦</div><h2>What are we building today?</h2><p>Ask anything. Make something amazing.</p></div>
  </main>
  <div class="tools"><button id="imageBtn" class="secondary">＋ Create image <small id="imageCount">5 left today</small></button><button id="clearBtn" class="secondary">Clear chat</button></div>
  <form id="form"><textarea id="prompt" rows="1" placeholder="Message LEVEL AI..." required></textarea><button id="send" aria-label="Send">➤</button></form>
  <footer><span id="status">Free for everyone</span><span id="count">20 messages left</span></footer>
</div>
<script src="app.js"></script>
</body></html>
